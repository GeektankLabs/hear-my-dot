<!doctype html><html lang="de"><meta charset="utf-8"><title>Hear My Dot</title>
<style>body{font:18px system-ui;max-width:38rem;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0}input{font:inherit}p{line-height:1.5}</style>
<h1>Hear My Dot</h1><p>ChatGPT-Audio priorisieren. YouTube-Videos und Podverse-Medien dieses Profils werden vorübergehend pausiert, andere Tabs stummgeschaltet.</p>
<label><input id="enabled" type="checkbox"> Aktiviert</label>
<label>Ruhezeit <input id="quiet" type="number" min="10" max="20" value="10"> Sekunden</label>
<button id="save">Speichern</button><p id="status" role="status"></p>
<p>Vor dem Entfernen hier deaktivieren und die Wiederherstellung abwarten. Chrome kann die Rückkehr im Ruhezustand verzögern.</p>
<script src="options.js"></script></html>
